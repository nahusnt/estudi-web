<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <!-- Recursos y metadatos de la página pública de creación de cuenta. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0a1a">
    <meta name="description" content="Estudi Web: crea tu cuenta y organiza tus tareas.">
    <title>Crear cuenta | Estudi Web</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script>
        // Aplica el tema y la paleta guardados por la app sin depender de app.js.
        (function () {
            try {
                var tema = localStorage.getItem("tema-lista-tareas");
                var paleta = localStorage.getItem("paleta-lista-tareas");
                if (tema === "light" || tema === "amoled" || tema === "dark") {
                    document.documentElement.dataset.theme = tema;
                }
                if (paleta) { document.documentElement.dataset.palette = paleta; }
            } catch (e) { /* por si el navegador bloquea localStorage */ }
        })();
    </script>
</head>
<body>
    <div class="bg-orb bg-orb-one" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-two" aria-hidden="true"></div>

    <main class="auth-shell">
        <section class="panel glass auth-card" aria-labelledby="registro-title">
            <a class="auth-brand" href="{{ url_for('login') }}">
                <span class="brand-logo" role="img" aria-label="Logo de Estudi Web"></span>
                <span>Estudi Web</span>
            </a>
            <h1 id="registro-title">Crear cuenta</h1>
            <p class="subtitle">Un minuto y ya tienes tu espacio listo.</p>

            {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% if mensajes %}
                    <div class="messages" aria-live="polite">
                        {% for tipo, mensaje in mensajes %}
                            <p class="notice notice-{{ tipo }}">{{ mensaje }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <!-- Envía los datos de registro; el servidor vuelve a validar cada campo. -->
            <form action="{{ url_for('registro') }}" method="POST" class="auth-form">
                <label class="field">
                    <span>Nombre de usuario único</span>
                    <input type="text" name="nombre_usuario" placeholder="por ejemplo, lola_rita" minlength="3" maxlength="24" pattern="[A-Za-z0-9_-]{3,24}" title="Usa entre 3 y 24 letras, números, guiones o guiones bajos." required autocomplete="username">
                </label>
                <label class="field">
                    <span>Correo</span>
                    <input type="email" name="correo" placeholder="nombre@dominio.com" required autocomplete="email">
                </label>
                <label class="field">
                    <span>Contraseña <small>(mínimo 8 caracteres)</small></span>
                    <input type="password" name="contrasena" placeholder="Elige una contraseña" minlength="8" required autocomplete="new-password">
                </label>
                <label class="field">
                    <span>Repetir contraseña</span>
                    <input type="password" name="confirmacion" placeholder="Otra vez, para confirmar" minlength="8" required autocomplete="new-password">
                </label>
                <button class="button button-primary" type="submit">Crear cuenta</button>
            </form>

            <p class="auth-alt">¿Ya tienes cuenta? <a class="text-link" href="{{ url_for('login') }}">Iniciar sesión</a></p>
        </section>
    </main>
</body>
</html>
