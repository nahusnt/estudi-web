<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tareas Personal</title>
</head>
<body>
    <h1>Lista de Tareas Personal</h1>

   
    <form action="/agregar" method="POST">
        <input type="text" name="titulo" placeholder="Escribí una tarea..." required>
        <button type="submit">Agregar Tarea</button>
    </form>

    <hr>

    
    <ul>
  {% for tarea in tareas %}
    <li style="margin-bottom: 8px;">
      
      <form action="/toggle/{{ tarea.id }}" method="POST" style="display:inline;">
        <input type="checkbox" onChange="this.form.submit()" {% if tarea.completada %}checked{% endif %}>
      </form>

    
      <span style="{% if tarea.completada %}text-decoration: line-through; color: gray;{% endif %}">
        {{ tarea.titulo }}
      </span>

      
      <form action="/eliminar/{{ tarea.id }}" method="POST" style="display:inline; margin-left: 10px;">
        <button type="submit" style="background: none; border: none; color: red; font-weight: bold; cursor: pointer;" title="Eliminar tarea">X</button>
      </form>
    </li>
  {% endfor %}
</ul>
</body>
</html>
