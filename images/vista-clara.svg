<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title description">
  <title id="title">Estudi Web: resumen en tema claro</title>
  <desc id="description">Vista previa de Estudi Web con navegación a Crear, Resumen y Ajustes, estadísticas de tareas y gráfico circular en tema claro.</desc>
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6ee7ff"/>
      <stop offset=".34" stop-color="#a78bfa"/>
      <stop offset=".68" stop-color="#ff9ad5"/>
      <stop offset="1" stop-color="#ffd8a8"/>
    </linearGradient>
    <linearGradient id="chrome" x2="0" y2="1">
      <stop stop-color="#2b2a5c"/>
      <stop offset=".48" stop-color="#7c80c9"/>
      <stop offset=".56" stop-color="#1b1a45"/>
      <stop offset="1" stop-color="#6f72bd"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#b8a8ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b8a8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#463c96" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1280" height="820" fill="#eceaff"/>
  <circle cx="1070" cy="115" r="250" fill="url(#glow)"/>
  <circle cx="170" cy="750" r="240" fill="#6ee7ff" opacity=".10"/>
  <rect x="164" y="28" width="952" height="764" rx="32" fill="#fff" fill-opacity=".34" stroke="#fff" stroke-opacity=".7"/>

